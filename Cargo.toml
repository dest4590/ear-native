[package]
name = "ear-native"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.14.0", features = ["image", "svg", "tokio"] }
rust-embed = { version = "8.13.0", features = ["include-flate"] }
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
crc = "3.4.0"
log = "0.4.35"
env_logger = "0.11.11"
bytes = "1.12.1"
futures = "0.3.34"
image = "0.25.10"
async-trait = "0.1.92"
directories = "6.0.0"
iced_futures = "0.14.0"
num_enum = "0.7.6"
tray-icon = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["full"] }
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Rfcomm",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Networking_Sockets",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
